<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In & Sign Up – MS STORE</title>
  <meta name="description" content="Sign in or create your MS STORE account to access order tracking, synchronized wishlist, and priority customer service.">

  <!-- Favicon & Touch Icons -->
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="theme-color" content="#4F46E5">


  <!-- Google Fonts: Poppins & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;">

  <!-- Minimal Header -->
  <header class="site-header">
    <div class="container">
      <div class="header-inner" style="justify-content:space-between;">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon"><i data-lucide="shopping-bag" style="width:20px;height:20px;"></i></div>
          <span>MS STORE<span class="accent-dot">.</span></span>
        </a>

        <a href="shop.html" class="btn btn-ghost btn-sm">
          <span>Back to Shop</span>
          <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- Main Auth Box -->
  <main style="display:flex;justify-content:center;padding:2rem 1rem 4.5rem;">
    <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);max-width:480px;width:100%;margin-left:auto;margin-right:auto;padding:2.5rem;overflow:hidden;">

      <!-- Tabs Header: Sign In / Create Account -->
      <div style="display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border-color);margin-bottom:2rem;">
        <button id="auth-tab-login" class="nav-link active" style="padding-bottom:0.75rem;font-size:1.05rem;font-weight:700;justify-content:center;">
          Sign In
        </button>
        <button id="auth-tab-register" class="nav-link" style="padding-bottom:0.75rem;font-size:1.05rem;font-weight:700;justify-content:center;">
          Create Account
        </button>
      </div>

      <!-- Google OAuth Button -->
      <button class="btn btn-outline btn-block btn-google-auth" style="margin-bottom:1.5rem;display:flex;align-items:center;justify-content:center;gap:0.75rem;height:46px;">
        <svg style="width:18px;height:18px;" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;">
        <div style="flex:1;height:1px;background:var(--border-color);"></div>
        <span style="font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;">Or with Email</span>
        <div style="flex:1;height:1px;background:var(--border-color);"></div>
      </div>

      <!-- ==========================================================================
           Tab 1: Sign In Form
           ========================================================================== -->
      <div id="login-form-pane">
        <form id="form-signin">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.4rem;">
              <label class="form-label" for="login-password" style="margin-bottom:0;">Password</label>
              <a href="#" id="btn-forgot-password" style="font-size:0.775rem;color:var(--primary);font-weight:600;">Forgot password?</a>
            </div>
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:1.5rem;">
            Sign In
          </button>
        </form>
      </div>

      <!-- ==========================================================================
           Tab 2: Sign Up Form
           ========================================================================== -->
      <div id="register-form-pane" style="display:none;">
        <form id="form-signup">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name</label>
            <input type="text" id="reg-name" class="form-control" placeholder="e.g. Eleanor Vance" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address</label>
            <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Create Password</label>
            <input type="password" id="reg-password" class="form-control" placeholder="Minimum 8 characters" required>

            <!-- Password Strength Bar -->
            <div style="width:100%;height:4px;background:var(--slate-200);border-radius:var(--radius-full);overflow:hidden;margin-top:0.4rem;">
              <div id="pwd-strength-bar" style="height:100%;width:0%;transition:all 0.3s ease;"></div>
            </div>
            <div id="pwd-strength-text" style="font-size:0.75rem;margin-top:0.3rem;"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:1.5rem;">
            Create Account
          </button>
        </form>
      </div>

    </div>
  </main>

  <!-- ==========================================================================
       Forgot Password Modal
       ========================================================================== -->
  <div class="modal-backdrop" id="forgot-pwd-modal">
    <div class="modal-dialog" style="max-width:440px;text-align:left;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
        <h3 style="font-size:1.25rem;">Reset Your Password</h3>
        <button class="drawer-close-btn" id="forgot-modal-close" aria-label="Close dialog">
          <i data-lucide="x" style="width:18px;height:18px;"></i>
        </button>
      </div>
      <p style="font-size:0.875rem;color:var(--text-muted);margin-bottom:1.5rem;">
        Enter your email address and we will immediately send you a secure link to reset your account password.
      </p>

      <form id="forgot-pwd-form">
        <div class="form-group">
          <label class="form-label" for="forgot-email-input">Registered Email</label>
          <input type="email" id="forgot-email-input" class="form-control" placeholder="name@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
      </form>
    </div>
  </div>

  <!-- Minimal Footer -->
  <footer style="padding:1.5rem 0;text-align:center;font-size:0.8125rem;color:var(--text-muted);border-top:1px solid var(--border-color);">
    <div>© 2026 MS STORE. Safe and encrypted customer access.</div>
  </footer>

  <!-- Scripts -->
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/firebase-service.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/cart.js"></script>
  <script type="module" src="js/wishlist.js"></script>
  <script type="module" src="js/ui.js"></script>
  <script type="module" src="js/login-page.js"></script>
</body>
</html>
