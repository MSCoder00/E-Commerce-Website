<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>

  <!-- Centered Card Container -->
  <g transform="translate(244, 210)" filter="url(#cardShadow)">
    <rect width="112" height="112" rx="28" fill="url(#logoGrad)"/>
    <text x="56" y="75" text-anchor="middle" font-family="'Poppins', 'Inter', -apple-system, sans-serif" font-size="48" font-weight="800" fill="#FFFFFF" letter-spacing="-2">MS</text>
    <circle cx="92" cy="92" r="9" fill="#FF6B6B"/>
  </g>

  <!-- Brand Label -->
  <text x="300" y="370" text-anchor="middle" font-family="'Poppins', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0F172A" letter-spacing="0.5">MS STORE<tspan fill="#FF6B6B">.</tspan></text>
  <text x="300" y="398" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="500" fill="#64748B" letter-spacing="0.3">Premium Storefront</text>
</svg>
